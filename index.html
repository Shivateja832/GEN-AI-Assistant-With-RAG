<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenAI Assistant with RAG</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        h1 { 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            background: #4CAF50; 
            color: white;
        }
        #chat { 
            height: 400px; 
            overflow-y: auto; 
            padding: 20px; 
            background: #f9f9f9;
        }
        .message { 
            margin: 10px 0; 
            padding: 10px; 
            border-radius: 10px;
            max-width: 70%;
        }
        .user { 
            background: #007bff; 
            color: white; 
            margin-left: auto;
            text-align: right;
        }
        .assistant { 
            background: #e9ecef; 
            color: #333;
        }
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
        }
        #message { 
            width: calc(100% - 120px); 
            padding: 10px; 
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-right: 10px;
        }
        button { 
            padding: 10px 20px; 
            background: #28a745; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer;
        }
        button:hover { background: #218838; }
        .loading { display: none; color: #666; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h1> GenAI Chat Assistant</h1>
        <div id="chat"></div>
        <div class="input-area">
            <input type="text" id="message" placeholder="Ask me anything about our services...">
            <button onclick="sendMessage()">Send</button>
            <button onclick="newChat()">New Chat</button>
            <div id="loading" class="loading">Thinking...</div>
        </div>
    </div>

    <script>
        let sessionId = localStorage.getItem('sessionId') || generateSessionId();
        localStorage.setItem('sessionId', sessionId);

        function generateSessionId() {
            return 'session-' + Math.random().toString(36).substr(2, 9);
        }

        function sendMessage() {
            const message = document.getElementById('message').value.trim();
            if (!message) return;
            addMessage('user', message);
            document.getElementById('message').value = '';
            document.getElementById('loading').style.display = 'block';

            fetch('http://localhost:5000/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId: sessionId, message: message })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                if (data.error) {
                    addMessage('assistant', 'Oops! ' + data.error);
                } else {
                    addMessage('assistant', data.reply);
                }
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                addMessage('assistant', 'my name is shiva teja');
            });
        }

        function addMessage(sender, text) {
            const chat = document.getElementById('chat');
            const msg = document.createElement('div');
            msg.className = 'message ' + sender;
            msg.textContent = text;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        function newChat() {
            sessionId = generateSessionId();
            localStorage.setItem('sessionId', sessionId);
            document.getElementById('chat').innerHTML = '';
        }

        document.getElementById('message').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
